[package]
name = "podium"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GPU-accelerated native desktop workspace for solo builders"
repository = "https://github.com/JeremySField/podium"

[dependencies]
# --- Core GPUI stack (Phase 0) ---
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"

# --- Phase 2: Config file parsing ---
# toml: TOML serde codec — used for projects.toml, kb_sources.toml, podium_state.toml
toml = "0.8"
# serde: derive macros for config structs
serde = { version = "1.0", features = ["derive"] }

# --- Phase 2: Zed watch channel lift ---
# parking_lot: RwLock used by watch.rs (Zed lift — Apache 2.0, Copyright 2022-2025 Zed Industries, Inc.)
parking_lot = "0.12"

# --- Phase 2: Native folder picker ---
# rfd: native OS folder browser dialog for onboarding Step 1
rfd = "0.17"

# --- Phase 2: Windows Credential Manager ---
# keyring: stores API keys and PATs in Windows Credential Manager (ADR-022)
# v3 is latest stable — v4 is RC only
keyring = "3"

# --- Phase 2: Timestamps ---
# chrono: last_opened timestamps in projects.toml
chrono = { version = "0.4", features = ["serde"] }

# --- Phase 2: Unique IDs ---
# uuid: project and agent IDs in projects.toml
uuid = { version = "1", features = ["v4"] }

# --- Cross-platform config directory ---
# dirs: resolves platform config dir — %APPDATA% on Windows, ~/.config on Linux,
# ~/Library/Application Support on macOS. Replaces APPDATA env var read.
dirs = "6"

# --- Phase 2 Step 12: KB source wing fetch ---
# reqwest: HTTP client for querying MemPalace MCP-over-HTTP endpoint to fetch
# available wings when a source with an endpoint is selected in Step 5.
# json feature enables .json() request body and serde response deserialization.
reqwest = { version = "0.12", features = ["json"], default-features = false }

# serde_json: JSON serialization for MCP JSON-RPC call body and response parsing.
serde_json = "1.0"
